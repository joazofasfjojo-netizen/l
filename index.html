<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braziscord - Versão Alpha</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Principal (Já abre direto aqui) */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .servers-sidebar {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }
        .server-icon {
            width: 48px;
            height: 48px;
            background-color: #2b2d31;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .server-icon:hover, .server-icon.active {
            border-radius: 16px;
            background-color: #5865f2;
        }
        .server-icon.home-btn {
            background-color: #5865f2;
            color: white;
        }
        .server-icon.add-btn {
            background-color: #2b2d31;
            color: #23a55a;
            font-size: 24px;
        }
        .server-icon.add-btn:hover {
            background-color: #23a55a;
            color: white;
            border-radius: 16px;
        }

        .channels-sidebar {
            width: 240px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
        }
        .server-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-weight: bold;
            color: white;
            border-bottom: 2px solid #1f2023;
        }
        .channel-list {
            padding: 8px;
            flex: 1;
            overflow-y: auto;
        }
        .channel-item {
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 2px;
            color: #949ba4;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .channel-item:hover, .channel-item.active {
            background-color: #35373c;
            color: white;
        }

        .chat-area {
            flex: 1;
            background-color: #313338;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #1f2023;
            font-weight: bold;
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            gap: 10px;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 16px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #5865f2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        .message-content h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: white;
        }
        .message-content p {
            margin: 0;
            font-size: 14px;
            color: #dbdee1;
            word-break: break-all;
        }
        .chat-input-area {
            padding: 0 16px 24px 16px;
        }
        .chat-input {
            width: 100%;
            background-color: #383a40;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .friends-container {
            padding: 24px;
            flex: 1;
            background-color: #313338;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .friends-container h2 { color: white; margin-top: 0; }
        .members-sidebar {
            width: 240px;
            background-color: #2b2d31;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .member-category {
            font-size: 12px;
            font-weight: bold;
            color: #949ba4;
            text-transform: uppercase;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px;
            border-radius: 4px;
        }
        .member-avatar {
            width: 32px;
            height: 32px;
            background-color: #eb459e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .member-name { font-size: 14px; }
        .btn-action {
            background-color: #23a55a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-action:hover { background-color: #1f8d4e; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, push, onChildAdded, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://brazisord-chat-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Utilizador padrão automático para testes (sem login por enquanto)
        let usuarioAtual = {
            uid: "usuario_teste_" + Math.floor(Math.random() * 1000),
            nome: "DevUser" + Math.floor(Math.random() * 100)
        };

        let chatAtivoId = "geralis_Braziscord";

        // Assim que a página abre, já inicia o app diretamente
        window.onload = function() {
            document.getElementById('spanUsuario').innerText = usuarioAtual.nome;
            document.getElementById('avatarMembro').innerText = usuarioAtual.nome.charAt(0).toUpperCase();
            escutarMensagens();
        };

        window.mudarAba = function(tipo, serverNome = "Braziscord") {
            let areaChat = document.getElementById('areaChatPrincipal');
            let areaAmigos = document.getElementById('areaAmigosPrincipal');
            
            if (tipo === 'home') {
                areaChat.style.display = 'none';
                areaAmigos.style.display = 'flex';
                document.getElementById('headerTitulo').innerText = "Amigos e Solicitações";
            } else {
                areaAmigos.style.display = 'none';
                areaChat.style.display = 'flex';
                document.getElementById('headerTitulo').innerText = "# " + serverNome;
                chatAtivoId = "geral_" + serverNome;
                escutarMensagens();
            }
        };

        window.enviarMensagem = function(event) {
            if (event.key === 'Enter') {
                let input = document.getElementById('inputMensagem');
                let texto = input.value.trim();

                if (texto !== '') {
                    let mensagemRef = ref(db, 'chats/' + chatAtivoId);
                    push(mensagemRef, {
                        autor: usuarioAtual.nome,
                        texto: texto,
                        hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    input.value = '';
                }
            }
        };

        function escutarMensagens() {
            let chatRef = ref(db, 'chats/' + chatAtivoId);
            let areaMensagens = document.getElementById('mensagens');
            areaMensagens.innerHTML = "";

            onChildAdded(chatRef, (data) => {
                let msg = data.val();
                let novaMsg = document.createElement('div');
                novaMsg.className = 'message';
                novaMsg.innerHTML = `
                    <div class="avatar">${msg.autor.charAt(0).toUpperCase()}</div>
                    <div class="message-content">
                        <h4>${msg.autor} <span style="font-size: 11px; color: #949ba4;">${msg.hora}</span></h4>
                        <p>${msg.texto}</p>
                    </div>
                `;
                areaMensagens.appendChild(novaMsg);
                areaMensagens.scrollTop = areaMensagens.scrollHeight;
            });
        }

        window.criarServidor = function() {
            let nomeServidor = prompt("Escolhe o nome do teu novo Servidor:");
            if (nomeServidor && nomeServidor.trim() !== "") {
                let listaServidores = document.getElementById('listaServidores');
                let novoIcone = document.createElement('div');
                novoIcone.className = 'server-icon';
                novoIcone.innerText = nomeServidor.charAt(0).toUpperCase();
                novoIcone.title = nomeServidor;
                novoIcone.onclick = function() {
                    document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active'));
                    novoIcone.classList.add('active');
                    window.mudarAba('servidor', nomeServidor);
                };
                listaServidores.insertBefore(novoIcone, listaServidores.lastElementChild);
                alert("Servidor " + nomeServidor + " criado com sucesso!");
            }
        };
    </script>
</head>
<body>

    <!-- Aplicação Principal a abrir de imediato -->
    <div class="app-container" id="app-container">
        <!-- 1. Servidores -->
        <div class="servers-sidebar" id="listaServidores">
            <div class="server-icon home-btn" title="Início / Amigos" onclick="mudarAba('home')">💬</div>
            <div style="width: 32px; height: 2px; background-color: #35373c; border-radius: 1px; margin: 4px 0;"></div>
            <div class="server-icon active" title="Braziscord Oficial" onclick="window.mudarAba('servidor', 'Braziscord'); document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active')); this.classList.add('active');">B</div>
            <div class="server-icon add-btn" title="Criar Servidor" onclick="criarServidor()">+</div>
        </div>

        <!-- 2. Canais -->
        <div class="channels-sidebar">
            <div class="server-header" id="tituloServidor">Braziscord</div>
            <div class="channel-list">
                <div style="font-size: 12px; color: #949ba4; margin-bottom: 8px; font-weight: bold;">DIRECT MESSAGES</div>
                <div class="channel-item" onclick="mudarAba('home')">
                    <span>👥 Amigos e Solicitações</span>
                </div>
                
                <div style="font-size: 12px; color: #949ba4; margin: 16px 0 8px 0; font-weight: bold;">CANAIS DE TEXTO</div>
                <div class="channel-item active" onclick="mudarAba('servidor', 'Braziscord')"># geral</div>
            </div>
        </div>

        <!-- 3. Área Principal -->
        <div class="chat-area">
            <div class="chat-header" id="headerTitulo"># Braziscord</div>
            
            <!-- Visão de Chat -->
            <div id="areaChatPrincipal" style="display: flex; flex-direction: column; flex: 1; height: 100%;">
                <div class="chat-messages" id="mensagens"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="inputMensagem" placeholder="Enviar mensagem (Aperte Enter)" onkeydown="enviarMensagem(event)">
                </div>
            </div>

            <!-- Visão da Aba de Amigos -->
            <div id="areaAmigosPrincipal" class="friends-container" style="display: none;">
                <h2>Painel de Amigos</h2>
                <p style="color: #949ba4;">Funcionalidade de amigos em desenvolvimento para as próximas etapas!</p>
            </div>
        </div>

        <!-- 4. Membros -->
        <div class="members-sidebar">
            <div class="member-category">Utilizador Atual</div>
            <div class="member-item">
                <div class="member-avatar" id="avatarMembro">U</div>
                <div class="member-name" style="color: #5865f2;" id="spanUsuario">DevUser</div>
            </div>
        </div>
    </div>

</body>
</html>
